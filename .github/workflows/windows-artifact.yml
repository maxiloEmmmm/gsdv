name: Windows Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install make
        shell: pwsh
        run: choco install make -y

      - name: Build
        shell: bash
        run: make build

      - name: Package
        shell: pwsh
        run: |
          $stage = "dist/windows-amd64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/release/gsdv.exe" "$stage/gsdv.exe"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/windows-amd64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/windows-amd64.zip
          if-no-files-found: error
          retention-days: 30
